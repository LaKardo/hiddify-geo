name: Update rule sets

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/main.yml
      - scripts/update-rule-sets.sh

permissions:
  contents: write

concurrency:
  group: rule-set-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout generator
        uses: actions/checkout@v4

      - name: Checkout published rule sets
        uses: actions/checkout@v4
        with:
          ref: rule-set
          path: output

      - name: Fetch, convert, and validate rule sets
        run: ./scripts/update-rule-sets.sh output

      - name: Upload MRS validation artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-rule-sets
          path: output/**/*.mrs

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add block country
          git diff --cached --quiet && exit 0
          git commit -m "Update SRS and MRS rule sets"
          git push origin HEAD:rule-set
